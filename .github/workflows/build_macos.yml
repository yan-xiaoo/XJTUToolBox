name: Build & Release MacOS

on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*", "v*.*.*-*", "v*.*.*.*"]

permissions:
  contents: write

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
      MACOS_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
      - run: brew install create-dmg
      - run: uv sync --locked --dev
      - name: Build application
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            export MACOS_VERSION="${RELEASE_TAG#v}"
          fi
          uv run build.py
      - name: Package and sign full DMG
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: uv run python -m scripts.sparkle_build package
      - uses: actions/upload-artifact@v4
        with:
          name: XJTUToolbox-macOS-${{ runner.arch }}
          path: |
            dist/XJTUToolbox-macOS-*.dmg
            dist/XJTUToolbox-macOS-*.sparkle.json
          if-no-files-found: error
      # 不触发 R2 同步；人工转正式版后 upload.yml 才发布更新。
      - name: Attach assets to prerelease
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: XJTUToolbox ${{ github.ref_name }}
          prerelease: true
          files: |
            dist/XJTUToolbox-macOS-*.dmg
            dist/XJTUToolbox-macOS-*.sparkle.json
