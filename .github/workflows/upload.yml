name: Upload release to Cloudflare R2

on:
  release:
    types: [released, published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Stable release tag to synchronize (e.g. v1.4.0)'
        required: true
        type: string

permissions:
  contents: read

# 不同 Release 也不能交叉读写同一正式 feed。
concurrency:
  group: sparkle-production-publish
  cancel-in-progress: false

jobs:
  upload:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' || (
          github.event.release.draft == false && github.event.release.prerelease == false
      ) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/sparkle-requirements.txt
      - name: Mirror assets and publish stable appcasts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -m scripts.sparkle_publish release
