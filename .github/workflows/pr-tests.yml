name: PR Tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-contract:
    name: Test contract
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate test inventory and workflow contract
        run: python -m unittest -v test.ci.test_pr_workflow

  test-shards:
    name: Test shard (${{ matrix.shard.name }}, ${{ matrix.platform.os }}, Python ${{ matrix.platform.python-version }})
    needs: test-contract
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-22.04
            python-version: "3.10"
            machine: x86_64
          - os: ubuntu-22.04
            python-version: "3.13"
            machine: x86_64
          - os: windows-latest
            python-version: "3.12"
            machine: x86_64
          - os: macos-latest
            python-version: "3.12"
            machine: arm64
          - os: macos-15-intel
            python-version: "3.12"
            machine: x86_64
        shard:
          - id: ai-assistant
            name: AI assistant
          - id: desktop-ui
            name: Desktop UI
          - id: notification-crawler
            name: Notification and crawler
          - id: auth-sessions-schedule
            name: Auth, sessions and schedule
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      QT_OPENGL: software
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.platform.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.platform.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libpulse-mainloop-glib0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0

      - name: Install locked dependencies
        run: uv sync --frozen --group dev

      - name: Verify runner architecture
        run: uv run --frozen python -m test.ci.preflight --expected-machine ${{ matrix.platform.machine }}

      - name: Run ${{ matrix.shard.name }} tests
        run: uv run --frozen python -m test.ci.run_shard ${{ matrix.shard.id }}

  linux-arm-shards:
    name: Test shard (${{ matrix.shard.name }}, ubuntu-22.04 aarch64, Python 3.10)
    needs: test-contract
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        shard:
          - id: ai-assistant
            name: AI assistant
          - id: desktop-ui
            name: Desktop UI
          - id: notification-crawler
            name: Notification and crawler
          - id: auth-sessions-schedule
            name: Auth, sessions and schedule
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      QT_OPENGL: software
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Run Linux ARM64 shard via QEMU
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: aarch64
          distro: ubuntu22.04
          githubToken: ${{ github.token }}
          env: |
            PYTHONUTF8: 1
            QT_QPA_PLATFORM: offscreen
            QT_OPENGL: software
          install: |
            apt-get update
            apt-get install -y curl build-essential python3-dev python3-venv python3-pyqt5 python3-pyqt5.qtmultimedia python3-pyqt5.qtsvg python3-pyqt5.qtx11extras
          run: |
            curl -LsSf https://astral.sh/uv/0.12.3/install.sh | env UV_INSTALL_DIR="/usr/local/bin" sh
            uv venv --python python3 --system-site-packages .venv
            uv sync --frozen --group dev
            uv pip install --python .venv/bin/python --no-deps pyqt-fluent-widgets==1.8.7 pyqt5-frameless-window==0.7.5 darkdetect==0.8.0 xcffib==1.12.0
            .venv/bin/python -m test.ci.preflight --expected-machine aarch64 --require-import PyQt5 --require-import PyQt5.QtMultimedia --require-import PyQt5.QtMultimediaWidgets --require-import PyQt5.QtSvg --require-import PyQt5.QtX11Extras --require-import qfluentwidgets --require-import qframelesswindow --require-import xcffib
            .venv/bin/python -m test.ci.run_shard ${{ matrix.shard.id }}

  existing-bug-regressions:
    name: Existing bug regressions
    needs: test-contract
    runs-on: ubuntu-22.04
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      QT_OPENGL: software
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Install Linux Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libpulse-mainloop-glib0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0

      - name: Install locked dependencies
        run: uv sync --frozen --group dev

      - name: Run historical bug regressions
        run: >-
          uv run --frozen python -m unittest -v
          test.ai_assistant.test_ai_features
          test.app.test_notice_search_ui
          test.notification.test_notification_sources
          test.app.test_notice_thread
          test.schedule.test_lesson

      - name: Run Issue 53 crawler challenge regression
        run: uv run --frozen python -m unittest -v test.test_crawler_challenge

  ci-gate:
    name: CI Gate
    if: always()
    needs: [test-contract, test-shards, linux-arm-shards, existing-bug-regressions]
    runs-on: ubuntu-latest
    steps:
      - name: Check required job results
        env:
          CONTRACT: ${{ needs.test-contract.result }}
          SHARDS: ${{ needs.test-shards.result }}
          ARM_SHARDS: ${{ needs.linux-arm-shards.result }}
          REGRESSIONS: ${{ needs.existing-bug-regressions.result }}
        run: |
          if [[ "$CONTRACT" != "success" || "$SHARDS" != "success" || "$ARM_SHARDS" != "success" || "$REGRESSIONS" != "success" ]]; then
            echo "::error::test-contract=$CONTRACT test-shards=$SHARDS linux-arm-shards=$ARM_SHARDS existing-bug-regressions=$REGRESSIONS"
            exit 1
          fi
          echo "All required tests passed."
