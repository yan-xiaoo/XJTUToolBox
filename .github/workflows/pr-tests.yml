name: PR Tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-contract:
    name: Test contract
    runs-on: ubuntu-22.04
    outputs:
      domains: ${{ steps.domains.outputs.domains }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate test inventory and workflow contract
        run: python -m unittest -v test.ci.test_pr_workflow

      - name: Export validated test domains
        id: domains
        shell: bash
        run: |
          domains=$(python -m test.ci.check_test_contract --format domain-json)
          echo "domains=$domains" >> "$GITHUB_OUTPUT"

  test-shards:
    name: ${{ matrix.domain.name }} (${{ matrix.platform.id }}, Python ${{ matrix.platform.python-version }})
    needs: test-contract
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - id: linux-x64-py311
            os: ubuntu-22.04
            python-version: "3.11"
            machine: x86_64
          - id: linux-x64-py313
            os: ubuntu-22.04
            python-version: "3.13"
            machine: x86_64
          - id: windows-x64-py312
            os: windows-latest
            python-version: "3.12"
            machine: x86_64
          - id: macos-arm64-py312
            os: macos-latest
            python-version: "3.12"
            machine: arm64
          - id: macos-intel-py312
            os: macos-15-intel
            python-version: "3.12"
            machine: x86_64
        domain: ${{ fromJSON(needs.test-contract.outputs.domains) }}
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      QT_OPENGL: software
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.platform.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.platform.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libpulse-mainloop-glib0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0

      - name: Install locked dependencies
        run: uv sync --frozen --group dev

      - name: Run ${{ matrix.domain.name }} tests
        env:
          XDG_STATE_HOME: ${{ runner.temp }}/xjtu-test-state
          XDG_CONFIG_HOME: ${{ runner.temp }}/xjtu-test-config
          XDG_DATA_HOME: ${{ runner.temp }}/xjtu-test-data
          XDG_CACHE_HOME: ${{ runner.temp }}/xjtu-test-cache
        run: uv run --frozen python -m test.ci.run_test_shard --domain ${{ matrix.domain.id }} --expected-machine ${{ matrix.platform.machine }}

  linux-arm-shards:
    name: ${{ matrix.domain.name }} (linux-arm64-py312, Python 3.12)
    needs: test-contract
    runs-on: ubuntu-22.04-arm
    strategy:
      fail-fast: false
      matrix:
        domain: ${{ fromJSON(needs.test-contract.outputs.domains) }}
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      QT_OPENGL: software
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Install Linux ARM64 dependencies
        run: bash scripts/setup_linux_arm64_ci.sh

      - name: Run Linux ARM64 shard
        env:
          XDG_STATE_HOME: ${{ runner.temp }}/xjtu-test-state
          XDG_CONFIG_HOME: ${{ runner.temp }}/xjtu-test-config
          XDG_DATA_HOME: ${{ runner.temp }}/xjtu-test-data
          XDG_CACHE_HOME: ${{ runner.temp }}/xjtu-test-cache
        run: |
          .venv/bin/python -m test.ci.run_test_shard \
            --domain ${{ matrix.domain.id }} \
            --expected-machine aarch64 \
            --require-import PyQt5 \
            --require-import PyQt5.sip \
            --require-import PyQt5.QtMultimedia \
            --require-import PyQt5.QtMultimediaWidgets \
            --require-import PyQt5.QtSvg \
            --require-import PyQt5.QtX11Extras \
            --require-import qfluentwidgets \
            --require-import qframelesswindow \
            --require-import xcffib

  existing-bug-regressions:
    name: Existing bug regressions
    needs: test-contract
    runs-on: ubuntu-22.04
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      QT_OPENGL: software
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Install Linux Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libpulse-mainloop-glib0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0

      - name: Install locked dependencies
        run: uv sync --frozen --group dev

      - name: Run historical bug regressions
        env:
          XDG_STATE_HOME: ${{ runner.temp }}/xjtu-test-state
          XDG_CONFIG_HOME: ${{ runner.temp }}/xjtu-test-config
          XDG_DATA_HOME: ${{ runner.temp }}/xjtu-test-data
          XDG_CACHE_HOME: ${{ runner.temp }}/xjtu-test-cache
        run: uv run --frozen python -m test.ci.run_test_regressions

  ci-gate:
    name: CI Gate
    if: always()
    needs: [test-contract, test-shards, linux-arm-shards, existing-bug-regressions]
    runs-on: ubuntu-latest
    steps:
      - name: Check required job results
        env:
          CONTRACT: ${{ needs.test-contract.result }}
          HOSTED_SHARDS: ${{ needs.test-shards.result }}
          ARM_SHARDS: ${{ needs.linux-arm-shards.result }}
          REGRESSIONS: ${{ needs.existing-bug-regressions.result }}
        run: |
          if [[ "$CONTRACT" != "success" || "$HOSTED_SHARDS" != "success" || "$ARM_SHARDS" != "success" || "$REGRESSIONS" != "success" ]]; then
            echo "::error::test-contract=$CONTRACT test-shards=$HOSTED_SHARDS linux-arm-shards=$ARM_SHARDS existing-bug-regressions=$REGRESSIONS"
            exit 1
          fi
          echo "All required tests passed."
